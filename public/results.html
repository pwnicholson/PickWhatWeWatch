<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results · Pick What We Watch</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/ui.js"></script><script defer src="/results.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="/">PICK <span>WHAT WE WATCH</span></a><nav class="nav"><a href="/">Shortlist</a><a href="/vote">Vote</a><a class="admin-link" href="/admin">Admin</a></nav></header>
    <section class="intro"><div class="eyebrow">Group decision</div><h1>The results.</h1><p id="results-meta">Ranked by net rank points, willingness, then first- and second-place votes.</p></section>
    <section id="results-list" class="results-list"></section>
    <div id="empty-results" class="empty" hidden>No shortlist titles to show.</div>
    <p id="results-status" class="status" aria-live="polite"></p>
    <section class="panel"><h2>Vetoes Summary</h2><div id="veto-summary"></div></section>
    <footer>Movie and TV data provided by TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
  </main>
  <div id="detail-modal" class="modal-backdrop" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-label="Title details"><button class="modal-close" aria-label="Close details">×</button><div class="modal-content"></div></section></div>
</body>
</html>
